apiVersion: batch/v1
kind: Job
metadata:
  name: wb-orders-migrate
  namespace: wb-orders
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels: { app.kubernetes.io/name: wb-orders-migrate }
    spec:
      restartPolicy: Never
      imagePullSecrets: [{ name: gitlab-registry }]
      containers:
        - name: migrate
          image: registry.gitlab.com/your-gitlab-namespace/wb-orders/migrate:latest
          args: ["-path", "/migrations", "-database", "$(DATABASE_URL)", "up"]
          envFrom:
            - secretRef: { name: wb-orders-secret }
          resources:
            requests: { cpu: 25m, memory: 32Mi }
            limits: { cpu: 200m, memory: 128Mi }
