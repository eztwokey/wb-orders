---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-worker
  namespace: wb-orders
spec:
  replicas: 2
  selector:
    matchLabels: { app.kubernetes.io/name: order-worker }
  template:
    metadata:
      labels: { app.kubernetes.io/name: order-worker }
    spec:
      terminationGracePeriodSeconds: 45
      imagePullSecrets: [{ name: gitlab-registry }]
      containers:
        - name: order-worker
          image: registry.gitlab.com/your-gitlab-namespace/wb-orders/order-worker:latest
          imagePullPolicy: IfNotPresent
          ports: [{ name: health, containerPort: 8082 }]
          envFrom:
            - configMapRef: { name: wb-orders-config }
            - secretRef: { name: wb-orders-secret }
          env: [{ name: HEALTH_ADDR, value: ":8082" }]
          readinessProbe:
            httpGet: { path: /ready, port: health }
            periodSeconds: 5
            timeoutSeconds: 2
          livenessProbe:
            httpGet: { path: /health, port: health }
            periodSeconds: 10
            timeoutSeconds: 2
          resources:
            requests: { cpu: 100m, memory: 64Mi }
            limits: { cpu: "1", memory: 512Mi }
